<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WinVM Bridge · 安装部署 / 卸载 动作流程图</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --line:#e3e7ee; --line-2:#cfd6e2;
  --ink:#141a22; --ink2:#55606f; --ink3:#8892a2;
  --blue:#2563eb; --blue-bg:#edf2ff; --blue-line:#c7d7ff;
  --amber:#b45309; --amber-bg:#fdf5e8; --amber-line:#f2ddb8;
  --red:#b42318; --red-bg:#fdf2f0; --red-line:#f3d3ce;
  --green:#067647; --green-bg:#ecfdf3; --green-line:#c3ead6;
  --gray:#5b6573; --gray-bg:#f1f3f6;
  --code-bg:#f8f9fb;
  --mono:"SF Mono",SFMono-Regular,"JetBrains Mono","Cascadia Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1460px; margin:0 auto; padding:0 22px 90px}

/* ── 头部 ── */
header.top{padding:30px 0 18px; border-bottom:1px solid var(--line)}
.top-row{display:flex; align-items:flex-start; gap:16px; flex-wrap:wrap}
h1{font-size:21px; font-weight:650; margin:0 0 4px; letter-spacing:-.2px}
.sub{color:var(--ink2); font-size:13px; margin:0}
.sub code{font-family:var(--mono); font-size:12px; background:#eaeef4; padding:1px 5px; border-radius:4px}
.tabs{display:inline-flex; gap:4px; margin:18px 0 0; padding:4px; background:#e8ecf3; border-radius:11px}
.tab{
  appearance:none; border:0; background:transparent; color:var(--ink2);
  padding:7px 16px; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer;
  font-family:inherit; transition:color .15s, background .15s, box-shadow .15s;
}
.tab:hover{color:var(--ink)}
.tab.on{background:#fff; box-shadow:0 1px 3px rgba(20,30,50,.12)}
.tab.on[data-k="deploy"]{color:var(--blue)}
.tab.on[data-k="undeploy"]{color:var(--amber)}
.tab .n{font-family:var(--mono); font-size:11px; opacity:.65; margin-left:6px}

/* ── 工具条 ── */
.bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 0 16px}
.search{
  flex:1 1 240px; min-width:180px; display:flex; align-items:center; gap:8px;
  background:#fff; border:1px solid var(--line-2); border-radius:8px; padding:6px 10px;
}
.search input{border:0; outline:0; font-family:inherit; font-size:13px; width:100%; background:transparent; color:var(--ink)}
.search svg{flex:0 0 auto; opacity:.45}
.btn{
  appearance:none; font-family:inherit; font-size:12.5px; font-weight:550; cursor:pointer;
  background:#fff; color:var(--ink2); border:1px solid var(--line-2); border-radius:7px; padding:6px 12px;
}
.btn:hover{color:var(--ink); border-color:#b9c2d0; background:#fbfcfe}
.legend{display:flex; gap:12px; align-items:center; margin-left:auto; font-size:11.5px; color:var(--ink3)}
.dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:1px}
.dot.f{background:var(--green)} .dot.m{background:var(--amber)} .dot.s{background:var(--red)} .dot.k{background:var(--gray)}

/* ── 主区 ── */
.main{display:grid; grid-template-columns:minmax(0,1fr) 442px; gap:20px; align-items:start}
.flow{min-width:0}

/* ── 阶段 ── */
.stage{margin:0 0 14px}
.stage-head{display:flex; align-items:center; gap:10px; margin:0 0 8px 2px}
.stage-tag{
  font-size:11px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;
  color:var(--blue); background:var(--blue-bg); border:1px solid var(--blue-line);
  padding:2px 8px; border-radius:5px;
}
.ud .stage-tag{color:var(--amber); background:var(--amber-bg); border-color:var(--amber-line)}
.stage-desc{font-size:12.5px; color:var(--ink3)}
.stage-body{display:flex; flex-direction:column; gap:8px}

/* ── 节点 ── */
.node{min-width:0}
.node-head{
  display:grid; grid-template-columns:18px 52px minmax(0,1fr) auto auto;
  align-items:center; gap:9px; width:100%; text-align:left;
  background:var(--panel); border:1px solid var(--line-2); border-radius:9px;
  padding:9px 12px 9px 8px; cursor:pointer; font-family:inherit; color:inherit;
  transition:border-color .14s, box-shadow .14s, background .14s;
  position:relative;
}
.node-head:hover{border-color:#a9b5c8; box-shadow:0 1px 3px rgba(20,30,50,.06)}
.node-head.sel{border-color:var(--blue); background:var(--blue-bg); box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.ud .node-head.sel{border-color:var(--amber); background:var(--amber-bg); box-shadow:0 0 0 3px rgba(180,83,9,.1)}
.tw{
  width:18px; height:18px; display:flex; align-items:center; justify-content:center;
  color:var(--ink3); font-size:10px; transition:transform .16s;
}
.node.open > .node-head .tw{transform:rotate(90deg)}
.node.leaf > .node-head .tw::after{content:""; width:5px; height:5px; border-radius:50%; background:var(--line-2)}
.node.open.leaf > .node-head .tw::after{background:var(--blue)}
.ncode{
  font-family:var(--mono); font-size:11.5px; font-weight:600; color:var(--ink2);
  background:#eef1f6; border-radius:4px; padding:1px 0; text-align:center;
  white-space:nowrap; overflow:hidden;
}
.node-head.sel .ncode{background:rgba(255,255,255,.75)}
.node.lvl-top > .node-head .ncode{background:var(--ink); color:#fff; font-size:13px; padding:3px 0; font-weight:700}
.node-head.sel .ncode{color:var(--ink)}
.nname{font-size:13.5px; font-weight:560; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.node.lvl-top > .node-head .nname{font-size:14.5px; font-weight:650}
.nmeta{
  font-family:var(--mono); font-size:10.5px; color:var(--ink3);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:230px;
}
.chip{
  font-family:var(--mono); font-size:11px; font-weight:600; padding:2px 7px; border-radius:20px;
  white-space:nowrap; border:1px solid transparent;
  max-width:210px; overflow:hidden; text-overflow:ellipsis;
}
.chip.f{color:var(--green); background:var(--green-bg); border-color:var(--green-line)}
.chip.m{color:var(--amber); background:var(--amber-bg); border-color:var(--amber-line)}
.chip.s{color:var(--red); background:var(--red-bg); border-color:var(--red-line)}
.chip.k{color:var(--gray); background:var(--gray-bg); border-color:#dfe3ea}

.node-kids{
  display:none; margin:7px 0 4px 26px; padding-left:14px;
  border-left:1px dashed var(--line-2);
  flex-direction:column; gap:7px;
}
.node.open > .node-kids{display:flex}
.node-kids .node-head{padding:7px 10px 7px 7px; border-radius:7px; border-color:var(--line)}
.node-kids .nname{font-size:12.8px}
.node-kids .ncode{font-size:10.5px; background:#f1f4f9}

/* ── 详情面板 ── */
.panel{
  position:sticky; top:14px; background:var(--panel); border:1px solid var(--line-2);
  border-radius:12px; max-height:calc(100vh - 28px); overflow:auto;
  box-shadow:0 2px 10px rgba(20,30,50,.05);
}
.panel-in{padding:18px 18px 24px}
.p-empty{padding:40px 24px; text-align:center; color:var(--ink3); font-size:13px; line-height:1.9}
.p-empty b{display:block; color:var(--ink2); font-size:13.5px; margin-bottom:6px}
.crumb{font-family:var(--mono); font-size:10.5px; color:var(--ink3); margin-bottom:7px; letter-spacing:.2px}
.crumb i{font-style:normal; padding:0 3px; opacity:.5}
.p-title{font-size:17px; font-weight:660; line-height:1.4; margin:0 0 10px; letter-spacing:-.2px}
.p-durline{display:flex; align-items:baseline; gap:9px; padding:9px 12px; background:var(--code-bg); border-radius:8px; margin-bottom:16px; border:1px solid var(--line)}
.p-durline b{font-family:var(--mono); font-size:15px; color:var(--ink); word-break:break-word; line-height:1.4}
.p-durline span{font-size:11.5px; color:var(--ink3)}
.sec{margin:0 0 16px}
.sec > h3{
  font-size:11px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
  color:var(--ink3); margin:0 0 7px; padding-bottom:5px; border-bottom:1px solid var(--line);
}
.sec p{margin:0; font-size:13px; line-height:1.75; color:var(--ink2)}
.sec ul{margin:0; padding:0; list-style:none}
.sec li{
  position:relative; padding-left:16px; font-size:12.8px; line-height:1.7; color:var(--ink2); margin-bottom:3px;
}
.sec li::before{content:""; position:absolute; left:3px; top:9px; width:4px; height:4px; border-radius:50%; background:var(--line-2)}
.cmd{margin:0 0 8px; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--code-bg)}
.cmd-top{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:4px 8px 4px 10px; border-bottom:1px solid var(--line); background:#fbfcfe}
.cmd-top span{font-size:11px; color:var(--ink3); font-weight:550}
.copy{
  appearance:none; border:1px solid var(--line-2); background:#fff; color:var(--ink3);
  font-family:inherit; font-size:10.5px; padding:1px 7px; border-radius:4px; cursor:pointer;
}
.copy:hover{color:var(--blue); border-color:var(--blue-line)}
.copy.ok{color:var(--green); border-color:var(--green-line); background:var(--green-bg)}
.cmd pre{
  margin:0; padding:9px 11px; font-family:var(--mono); font-size:11.5px; line-height:1.72;
  color:#1f2937; white-space:pre-wrap; word-break:break-word; overflow-x:auto;
}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.schip{
  display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:11px;
  background:var(--code-bg); border:1px solid var(--line); border-radius:6px; padding:3px 8px; color:var(--ink2);
}
.schip em{font-style:normal; color:var(--ink3); font-size:10px; font-family:-apple-system,sans-serif}
.bar{display:flex; height:16px; border-radius:5px; overflow:hidden; border:1px solid var(--line); margin-bottom:9px}
.bar i{display:block; height:100%}
.barleg{display:flex; flex-direction:column; gap:3px}
.barleg div{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink2)}
.barleg b{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink); font-weight:600}
.barleg .sw{width:8px; height:8px; border-radius:2px; flex:0 0 auto}
.note{
  font-size:12px; color:var(--ink2); background:var(--amber-bg); border:1px solid var(--amber-line);
  border-radius:8px; padding:9px 11px; line-height:1.7;
}
.tip{font-size:11.5px; color:var(--ink3); margin:8px 0 0; line-height:1.7}

/* ── 隐藏 / 过滤 ── */
.hide{display:none !important}
.mark{background:#fff3bf; border-radius:3px}

@media (max-width:1080px){
  .main{grid-template-columns:1fr}
  .panel{position:relative; top:0; max-height:none}
  .nmeta{display:none}
  .node-head{grid-template-columns:18px 52px minmax(0,1fr) auto}
  .legend{display:none}
}
@media (max-width:620px){
  .wrap{padding:0 14px 60px}
  h1{font-size:18px}
  .ncode{font-size:10.5px}
  .node-kids{margin-left:12px; padding-left:10px}
}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div class="top-row">
    <div style="flex:1 1 420px">
      <h1>WinVM Bridge · 安装部署 / 卸载 动作流程图</h1>
      <p class="sub">
        <code>winvm-plugin-deploy</code> v2.5.5 · 5 步 deploy + 3 步 undeploy ·
        点击任一环节逐层展开，右侧显示该环节的<b>前置条件 / 动作命令 / 依赖脚本 / 预估耗时</b>
      </p>
    </div>
  </div>
  <div class="tabs">
    <button class="tab on" data-k="deploy">安装部署<span class="n">5 步 · 47 环节</span></button>
    <button class="tab" data-k="undeploy">卸载<span class="n">3 步 · 17 环节</span></button>
  </div>
</header>

<div class="bar">
  <label class="search">
    <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="7" cy="7" r="4.6"></circle><path d="M10.6 10.6 14 14"></path>
    </svg>
    <input id="q" type="search" placeholder="搜索环节 / 脚本名 / 命令关键字…">
  </label>
  <button class="btn" id="expandAll">全部展开</button>
  <button class="btn" id="collapseAll">全部收起</button>
  <div class="legend">
    <span><i class="dot f"></i>&lt;5s</span>
    <span><i class="dot m"></i>5–30s</span>
    <span><i class="dot s"></i>&gt;30s</span>
    <span><i class="dot k"></i>SKIP / 无操作</span>
  </div>
</div>

<main class="main">
  <div class="flow" id="flow"></div>
  <aside class="panel" id="panel">
    <div class="p-empty">
      <b>选一个环节</b>
      左侧点任意卡片即可展开下一层<br>并在本面板查看 5 项要素
    </div>
  </aside>
</main>

</div>

<script>
/* ══════════════════════════════════════════════════════════════════
   数据源：skills/winvm-plugin-deploy（v2.5.5）
   —— 步骤/子环节取自 scripts/*.sh 的 st_begin 标识；
   —— 命令取自脚本实际执行行；
   —— 耗时取自 references/deploy-timeline.md 的真机实测（真机实测）与
      V1.4.34 幂等态分步计时（docs/04-ops/purge-redeploy-rehearsal-20261118.md §5.3 / §6）。
   ══════════════════════════════════════════════════════════════════ */

const T = (label, ms) => ({ label, ms });

const DEPLOY = {
  key: 'deploy',
  stages: [
    { tag: '阶段 A', desc: '第 1 ‖ 2 步 并行执行（互不依赖）', ids: ['d1', 'd2'] },
    { tag: '阶段 B', desc: '第 3 ‖ 4 步 并行执行（需阶段 A 完成）', ids: ['d3', 'd4'] },
    { tag: '阶段 C', desc: '第 5 步 单跑（需 3 + 4 完成）', ids: ['d5'] }
  ],
  nodes: {

  /* ─────────────── 第 1 步 ─────────────── */
  d1: {
    code: '1', name: '建 host ↔ VM 免密 SSH 通道',
    dur: T('1s（已 READY）/ 15s + 7s（需建）', 1500),
    summary: '让宿主能无口令登录 VM。先判（1a）：通道 READY 就整步 SKIP；DOWN 就进 1p 用凭据自动建 —— 1p 一旦成功即整步结束，1b/1c/1d 一个都不跑；只有 1p 也失败才退回「打印一条命令让用户在 VM 粘」。',
    pre: [
      'VM 已开机且 TCP 22 可达（SSH 服务在跑）',
      '宿主有 node（ssh2 运行时）与 ssh-keygen',
      'VM_HOST / VM_USER / VM_SSH_PORT 已设置（或来自 deploy-state.env）'
    ],
    cmds: [
      { label: '整步入口', code: 'VM_HOST=172.16.100.2 bash scripts/deploy.sh --only 1' },
      { label: '状态判据（_common.sh）', code: 'channel_ready 5000   # → ssh2-conn.mjs ping，退出码 0 = READY' }
    ],
    scripts: [
      { n: 'deploy-1-ssh.sh', d: '1a~1d 主流程与重试循环' },
      { n: 'deploy-1p-autokey.sh', d: '凭据自动建通道 1p.1~1p.7' },
      { n: '_common.sh', d: 'channel_ready / key_facts / 状态与计时' },
      { n: 'ssh2-conn.mjs', d: 'ssh2 后端实体（ping / exec）' },
      { n: 'winvm-sshd-oneclick.ps1', d: 'VM 侧单脚本：建通道 / -Rollback' }
    ],
    children: ['d1a', 'd1p', 'd1b', 'd1c', 'd1d', 'd1v']
  },

  d1a: {
    code: '1a', name: '判断通道是否 READY（整步总闸）',
    dur: T('1s（READY）/ 15s（DOWN）', 1000),
    summary: '判据是「新建连接真的能通」，不是 /health 长连口径 —— WEDGE 时两者可长期背离（health 恒 200 而新建全死）。READY 时还顺带确认「是本技能这把钥」并补写回滚基线。',
    pre: ['WINVM_VM_KEY 指向的私钥存在', '后端 auto（ssh2 优先，二进制仅兜底）'],
    cmds: [
      { label: '判据', code: 'if channel_ready 5000; then ... exit 0; fi   # READY 即 1b~1d 全 SKIP' },
      { label: '钥归属 + 回滚基线', code: 'read -r _ex _ours _kh <<<"$(key_facts)"\nwrite_baseline_if_absent "$_ex" "$_ours" "$_kh"   # 供 undeploy 精确删钥' }
    ],
    scripts: [{ n: '_common.sh', d: 'channel_ready：判据唯一入口' }, { n: 'ssh2-conn.mjs', d: 'ping 子命令（5s 窗）' }],
    parts: [{ n: 'ssh2 建连 + auth + ping', ms: 1000 }],
    fail: 'DOWN 不算失败：转 1p；1p 也不成则进 1b~1d 人工路径。'
  },

  d1p: {
    code: '1p', name: '凭据自动建通道（S1 / S2 / S3 三级）',
    dur: T('3~5s（S1 命中）/ 7s（凭据不可用）/ 25~40s（S2）', 4000),
    summary: '准入判据只有一条：只要「用户名 + 口令」或「用户名 + 空口令」任一能登录，就全自动建通道。登录后如何拿到管理员能力由本脚本自己解决，不必劳烦用户粘命令。',
    pre: [
      'sshd 仍允许口令认证（PasswordAuthentication yes）',
      '账户在 Administrators 组（写 ProgramData 授权文件需要完整令牌）',
      '通道后端必须是 ssh2 —— 二进制后端在口令认证段会相位挂起',
      '空口令账户：需 WINVM_SSH_ALLOW_EMPTY=1 显式开启尝试'
    ],
    cmds: [
      { label: '入口（口令）', code: 'WINVM_SSH_PASSWORD=<pwd> bash scripts/deploy-1p-autokey.sh' },
      { label: '入口（无密码账户）', code: 'WINVM_SSH_ALLOW_EMPTY=1 bash scripts/deploy-1p-autokey.sh' },
      { label: '退出码语义', code: 'exit 0 = 通道已建好（CHANNEL_READY 落 state）\nexit 2 = 不可用 → 回退 1b 备钥 + 1c 人工命令（零行为倒退）' }
    ],
    scripts: [
      { n: 'deploy-1p-autokey.sh', d: '1p.1~1p.7 全部逻辑' },
      { n: 'ssh2-conn.mjs', d: 'WINVM_SSH_AUTH=password 分支' },
      { n: '_common.sh', d: '透传 WINVM_SSH_AUTH / WINVM_SSH_PASSWORD' },
      { n: 'winvm-sshd-oneclick.ps1', d: '仅 S2 降级时才用' }
    ],
    parts: [
      { n: '1p.1 凭据可达性（2 发 ping）', ms: 7000 },
      { n: '1p.2 身份判定（net session）', ms: 1000 },
      { n: '1p.3 公钥就位（命中已存在）', ms: 0 },
      { n: '1p.4 S1 直写授权文件', ms: 3000 },
      { n: '1p.5 S1 免密回验（≤12s 窗）', ms: 2000 }
    ],
    fail: 'S1 回验不通才跑 S2（oneclick 修 sshd_config + 重启 sshd，25~40s）；S2 也不通退 2，回 1c 人工。',
    note: '口径说明：上面的「预估时长」是 <b>S1 一次命中</b> 的典型值（3~5s）；右侧耗时构成列的是 <b>凭据不可用</b> 那条最坏路径（1p.1 先吃 7s 才止损），两条不是同一个场景，别相加。',
    children: ['d1p1', 'd1p2', 'd1p3', 'd1p4', 'd1p5', 'd1p6', 'd1p7']
  },

  d1p1: {
    code: '1p.1', name: '登录凭据可达性（口令 / 空口令）',
    dur: T('7s（不可用）/ 1s（可用）', 7000),
    summary: '先发 2 发 ping 判「能不能登录」，不吃 vmssh 的 3 次重试 —— 这决定失败时 7s 就止损而不是 15s 后才降级。',
    pre: ['已解析到口令来源（env > VM_PASSWORD > 密码文件 > tty）', '空口令需 WINVM_SSH_PASSWORD_EMPTY=1 与「未提供口令」区分'],
    cmds: [

/* ══════════════════ 渲染 ══════════════════ */
const PALETTE = ['#2563eb','#0ea5a4','#f59e0b','#8b5cf6','#ef4444','#64748b','#10b981','#e11d48'];

const specs = { deploy: DEPLOY, undeploy: UNDEPLOY };
Object.values(specs).forEach(sp => {
  Object.entries(sp.nodes).forEach(([id, n]) => { n.id = id; });
  Object.entries(sp.nodes).forEach(([id, n]) => {
    (n.children || []).forEach(cid => { if (sp.nodes[cid]) sp.nodes[cid].parent = id; });
  });
  // 顶层标注
  sp.stages.forEach(st => st.ids.forEach(id => { if (sp.nodes[id]) sp.nodes[id].top = true; }));
});

function durClass(ms) {
  if (ms === 0) return 'k';
  if (ms < 5000) return 'f';
  if (ms <= 30000) return 'm';
  return 's';
}

function nodeHTML(sp, id, depth) {
  const n = sp.nodes[id];
  if (!n) return '';
  const kids = n.children && n.children.length ? n.children : null;
  const cls = ['node'];
  if (!kids) cls.push('leaf');
  if (n.top) cls.push('lvl-top');
  return `<div class="${cls.join(' ')}" data-id="${id}" data-key="${sp.key}">
    <button class="node-head" type="button">
      <span class="tw"></span>
      <span class="ncode">${n.code}</span>
      <span class="nname">${n.name}</span>
      <span class="nmeta">${n.scripts && n.scripts[0] ? n.scripts[0].n : ''}</span>
      <span class="chip ${durClass(n.dur.ms)}">${n.dur.label}</span>
    </button>
    ${kids ? `<div class="node-kids">${kids.map(k => nodeHTML(sp, k, depth + 1)).join('')}</div>` : ''}
  </div>`;
}

function renderAll() {
  const flow = document.getElementById('flow');
  flow.innerHTML = ['deploy', 'undeploy'].map(key => {
    const sp = specs[key];
    const stages = sp.stages.map(st => `
      <section class="stage ${key === 'undeploy' ? 'ud' : ''}">
        <div class="stage-head">
          <span class="stage-tag">${st.tag}</span>
          <span class="stage-desc">${st.desc}</span>
        </div>
        <div class="stage-body">${st.ids.map(id => nodeHTML(sp, id, 0)).join('')}</div>
      </section>`).join('');
    return `<div class="flowpane ${key === 'undeploy' ? 'ud' : ''}" data-key="${key}" ${key === 'undeploy' ? 'style="display:none"' : ''}>${stages}</div>`;
  }).join('');
}

renderAll();

/* 默认展开：每个流程的第一个顶层节点 */
function openDefault(key) {
  const sp = specs[key];
  const first = sp.stages[0].ids[0];
  const el = document.querySelector(`.flowpane[data-key="${key}"] .node[data-id="${first}"]`);
  if (el) el.classList.add('open');
}
openDefault('deploy');
openDefault('undeploy');

/* ══════════════════ 详情面板 ══════════════════ */
const panel = document.getElementById('panel');
let currentKey = 'deploy';
let selId = null;

function crumbs(sp, n) {
  const chain = [];
  let cur = n;
  while (cur) { chain.unshift(cur.code); cur = cur.parent ? sp.nodes[cur.parent] : null; }
  return `${sp.key}<i>›</i>` + chain.join('<i>›</i>');
}

function partsHTML(n) {
  const parts = (n.parts || []).filter(p => p.ms > 0);
  if (!parts.length) return '<p style="color:var(--ink3);font-size:12.5px">该环节为单次原子调用，无内部拆分。</p>';
  const total = parts.reduce((a, b) => a + b.ms, 0);
  const bar = parts.map((p, i) =>
    `<i style="width:${(p.ms / total * 100).toFixed(2)}%;background:${PALETTE[i % PALETTE.length]}"></i>`).join('');
  const leg = parts.map((p, i) => `
    <div><span class="sw" style="background:${PALETTE[i % PALETTE.length]}"></span>
      <span>${p.n}</span><b>${(p.ms / 1000).toFixed(p.ms < 1000 ? 2 : 1)}s</b></div>`).join('');
  return `<div class="bar">${bar}</div><div class="barleg">${leg}</div>
    <p class="tip">合计 ${(total / 1000).toFixed(1)}s（按实测占比）</p>`;
}

function showDetail(key, id) {
  const sp = specs[key];
  const n = sp.nodes[id];
  if (!n) return;
  selId = id;
  document.querySelectorAll('.node-head.sel').forEach(e => e.classList.remove('sel'));
  const head = document.querySelector(`.flowpane[data-key="${key}"] .node[data-id="${id}"] > .node-head`);
  if (head) head.classList.add('sel');

  const cmds = (n.cmds || []).map((c, i) => `
    <div class="cmd">
      <div class="cmd-top"><span>${c.label || '命令'}</span>
        <button class="copy" data-i="${key}-${id}-${i}" type="button">复制</button></div>
      <pre data-code="${key}-${id}-${i}">${c.code.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</pre>
    </div>`).join('');

  const scripts = (n.scripts || []).map(s =>
    `<span class="schip">${s.n}<em>${s.d || ''}</em></span>`).join('');

  const pres = (n.pre && n.pre.length)
    ? `<ul>${n.pre.map(p => `<li>${p}</li>`).join('')}</ul>`
    : `<p style="color:var(--ink3);font-size:12.5px">无前置条件 —— 本环节可从任意状态进入。</p>`;

  panel.innerHTML = `<div class="panel-in">
    <div class="crumb">${crumbs(sp, n)}</div>
    <h2 class="p-title">${n.name}</h2>
    <div class="p-durline"><b>${n.dur.label}</b><span>预估执行时长${n.dur.ms > 0 && n.dur.ms < 500 ? '（毫秒级）' : ''}</span></div>
    <div class="sec"><h3>职责</h3><p>${n.summary}</p></div>
    <div class="sec"><h3>前置条件</h3>${pres}</div>
    <div class="sec"><h3>动作命令</h3>${cmds || '<p style="color:var(--ink3);font-size:12.5px">无独立命令（由上层脚本驱动）。</p>'}</div>
    <div class="sec"><h3>依赖脚本</h3><div class="chips">${scripts || '<span class="schip">—</span>'}</div></div>
    <div class="sec"><h3>耗时构成</h3>${partsHTML(n)}</div>
    ${n.fail ? `<div class="sec"><h3>失败 / 降级</h3><div class="note">${n.fail}</div></div>` : ''}
    ${n.note ? `<div class="sec"><h3>备注</h3><p style="font-size:12.5px;color:var(--ink3)">${n.note}</p></div>` : ''}
  </div>`;

  panel.scrollTop = 0;   // 换节点时详情面板回到顶部，避免停在上一段中间
  panel.querySelectorAll('.copy').forEach(btn => {
    btn.addEventListener('click', async () => {
      const code = panel.querySelector(`pre[data-code="${btn.dataset.i}"]`).textContent;
      try {
        await navigator.clipboard.writeText(code);
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = code; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (_) {}
        document.body.removeChild(ta);
      }
      btn.textContent = '已复制'; btn.classList.add('ok');
      setTimeout(() => { btn.textContent = '复制'; btn.classList.remove('ok'); }, 1400);
    });
  });
}

/* ══════════════════ 事件 ══════════════════ */
document.getElementById('flow').addEventListener('click', e => {
  const head = e.target.closest('.node-head');
  if (!head) return;
  const nodeEl = head.parentElement;
  const id = nodeEl.dataset.id;
  const key = nodeEl.dataset.key;
  const hasKids = nodeEl.querySelector(':scope > .node-kids');
  const wasSel = head.classList.contains('sel');
  if (hasKids) {
    // 首次点某节点 = 展开（不收起，避免"刚打开就被折叠"）；
    // 再点已选中的节点 = 折叠，给一个明确的收起手势。
    if (wasSel) nodeEl.classList.toggle('open');
    else nodeEl.classList.add('open');
  }
  showDetail(key, id);
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    tab.classList.add('on');
    currentKey = tab.dataset.k;
    document.querySelectorAll('.flowpane').forEach(p => {
      p.style.display = p.dataset.key === currentKey ? '' : 'none';
    });
    const sp = specs[currentKey];
    showDetail(currentKey, sp.stages[0].ids[0]);
    document.querySelector(`.flowpane[data-key="${currentKey}"] .node[data-id="${sp.stages[0].ids[0]}"]`)?.classList.add('open');
  });
});

document.getElementById('expandAll').addEventListener('click', () => {
  document.querySelectorAll(`.flowpane[data-key="${currentKey}"] .node`).forEach(n => n.classList.add('open'));
});
document.getElementById('collapseAll').addEventListener('click', () => {
  const pane = document.querySelector(`.flowpane[data-key="${currentKey}"]`);
  pane.querySelectorAll('.node').forEach(n => n.classList.remove('open'));
  pane.querySelectorAll('.lvl-top').forEach(n => n.classList.add('open'));
});

/* 搜索：命中则展开其所有祖先 */
const q = document.getElementById('q');
q.addEventListener('search', () => { q.dispatchEvent(new Event('input')); });
q.addEventListener('input', () => {
  const kw = q.value.trim().toLowerCase();
  const pane = document.querySelector(`.flowpane[data-key="${currentKey}"]`);
  if (!kw) {
    pane.querySelectorAll('.node').forEach(n => {
      n.classList.remove('dim');
      n.style.opacity = '';
    });
    return;
  }
  const sp = specs[currentKey];
  pane.querySelectorAll('.node').forEach(n => {
    const d = sp.nodes[n.dataset.id];
    if (!d) return;
    const hay = [d.code, d.name, d.summary, (d.scripts || []).map(s => s.n).join(' '),
                 (d.cmds || []).map(c => c.code).join(' '), (d.pre || []).join(' ')].join(' ').toLowerCase();
    const hit = hay.includes(kw);
    n.classList.toggle('dim', !hit);
    n.style.opacity = hit ? '1' : '.34';
    if (hit) { let p = n.parentElement.closest('.node'); while (p) { p.classList.add('open'); p = p.parentElement.closest('.node'); } }
  });
});

/* 初始详情 */
showDetail('deploy', 'd1');
</script>
</body>
</html>
